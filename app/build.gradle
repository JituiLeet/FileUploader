plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jituileet.fileuploader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jituileet.fileuploader'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '1.1.0'
    }

    lint {
        disable += 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}